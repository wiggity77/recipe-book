<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Recipe Book</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff; --bg2: #f7f6f2; --bg3: #f0efe9;
    --text: #1a1a18; --text2: #6b6a65; --text3: #a8a7a2;
    --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
    --radius: 10px; --radius-lg: 14px; --accent: #2c2c2a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2b;
      --text: #f0efe8; --text2: #a8a7a0; --text3: #6b6a63;
      --border: rgba(255,255,255,0.10); --border2: rgba(255,255,255,0.18);
      --accent: #e8e7e0;
    }
  }

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }

  header { background: var(--bg); border-bottom: 0.5px solid var(--border2); padding: 0 1.5rem; display: flex; align-items: center; gap: 1rem; height: 58px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; flex: 1; }
  header h1 span { color: var(--text2); font-weight: 400; }

  .nav-tabs { display: flex; gap: 2px; }
  .tab { padding: 6px 14px; font-size: 13px; background: none; border: 0.5px solid transparent; border-radius: var(--radius); cursor: pointer; color: var(--text2); transition: all .15s; display: flex; align-items: center; gap: 5px; font-family: inherit; }
  .tab:hover { background: var(--bg2); color: var(--text); }
  .tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  main { max-width: 780px; margin: 0 auto; padding: 2rem 1.25rem; }
  .view { display: none; }
  .view.active { display: block; }

  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .recipe-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.1rem; cursor: pointer; transition: border-color .15s, transform .1s; }
  .recipe-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .recipe-card:active { transform: scale(0.99); }
  .tag-pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; margin-bottom: 8px; font-weight: 500; }
  .recipe-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recipe-card p { font-size: 13px; color: var(--text2); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text3); font-size: 14px; }
  .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; opacity: .4; }

  .back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; color: var(--text2); font-size: 14px; padding: 0; font-family: inherit; margin-bottom: 1.25rem; transition: color .15s; }
  .back-btn:hover { color: var(--text); }
  .detail-header { margin-bottom: 1.25rem; }
  .detail-header h2 { font-size: 22px; font-weight: 700; margin-top: 8px; letter-spacing: -0.02em; }
  .detail-body { white-space: pre-wrap; font-size: 15px; line-height: 1.85; background: var(--bg2); border-radius: var(--radius); padding: 1.25rem 1.4rem; color: var(--text); }

  .form-section { margin-bottom: 1.5rem; }
  .form-label { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 6px; display: block; }
  input[type="text"], textarea { width: 100%; padding: 9px 12px; font-size: 14px; font-family: inherit; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); color: var(--text); outline: none; transition: border-color .15s; }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 200px; resize: vertical; line-height: 1.7; }
  .input-row { display: flex; gap: 10px; }
  .input-row input:first-child { flex: 1; }
  .input-row input:last-child { width: 160px; flex-shrink: 0; }

  button.primary { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 10px 20px; background: var(--accent); color: var(--bg); border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity .15s; }
  button.primary:hover { opacity: .85; }
  button.secondary { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 18px; background: var(--bg); color: var(--text); border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 14px; cursor: pointer; font-family: inherit; transition: background .15s; }
  button.secondary:hover { background: var(--bg2); }
  button.danger { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: none; color: #c0392b; border: 0.5px solid #c0392b; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: inherit; transition: background .15s; }
  button.danger:hover { background: #fdf0f0; }

  .notice { font-size: 13px; padding: 10px 14px; border-radius: var(--radius); margin-top: 12px; }
  .notice.success { background: #eaf3de; color: #3b6d11; }
  .notice.error { background: #fcebeb; color: #a32d2d; }

  .week-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .week-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.1rem 1rem; text-align: center; }
  .week-card .day-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text3); margin-bottom: 8px; }
  .week-card h3 { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
  .week-card.empty h3 { color: var(--text3); font-weight: 400; font-style: italic; }
  .week-actions { display: flex; gap: 10px; align-items: center; margin-bottom: 1.5rem; }
  .week-actions button.primary { flex: 1; width: auto; }

  @media (max-width: 540px) {
    .week-grid { grid-template-columns: 1fr; }
    .input-row { flex-direction: column; }
    .input-row input:last-child { width: 100%; }
    .nav-tabs .tab span { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>My recipe book <span id="recipe-count"></span></h1>
  <nav class="nav-tabs">
    <button class="tab active" onclick="showTab('recipes')" id="tab-recipes"><i class="ti ti-notebook"></i><span>Recipes</span></button>
    <button class="tab" onclick="showTab('add')" id="tab-add"><i class="ti ti-plus"></i><span>Add</span></button>
    <button class="tab" onclick="showTab('week')" id="tab-week"><i class="ti ti-calendar-week"></i><span>This week</span></button>
  </nav>
</header>

<main>
  <div id="view-recipes" class="view active">
    <div id="recipe-detail" style="display:none">
      <button class="back-btn" onclick="closeDetail()"><i class="ti ti-arrow-left"></i> Back to recipes</button>
      <div class="detail-header">
        <span id="detail-tag" class="tag-pill"></span>
        <h2 id="detail-title"></h2>
      </div>
      <div id="detail-body" class="detail-body"></div>
      <div style="margin-top:1.25rem">
        <button class="danger" onclick="deleteRecipe()"><i class="ti ti-trash"></i> Delete recipe</button>
      </div>
    </div>
    <div id="recipe-list-wrap">
      <div id="recipe-grid" class="recipe-grid"></div>
      <div id="empty-recipes" class="empty-state" style="display:none">
        <i class="ti ti-salad"></i>
        No recipes yet — add your first one!
      </div>
    </div>
  </div>

  <div id="view-add" class="view">
    <div class="form-section">
      <label class="form-label">Recipe name</label>
      <input type="text" id="recipe-name" placeholder="e.g. Chicken Tikka Masala" maxlength="80" />
    </div>
    <div class="form-section">
      <label class="form-label">Category tag (optional)</label>
      <input type="text" id="recipe-tag" placeholder="e.g. Italian, Asian, Vegetarian, Quick…" maxlength="30" />
    </div>
    <div class="form-section">
      <label class="form-label">Recipe — paste or type anything</label>
      <textarea id="recipe-body" placeholder="Paste your full recipe here — ingredients, steps, notes, cook time, anything..."></textarea>
    </div>
    <button class="primary" onclick="saveRecipe()"><i class="ti ti-device-floppy"></i> Save recipe</button>
    <div id="save-notice" style="display:none"></div>
  </div>

  <div id="view-week" class="view">
    <div class="week-actions">
      <button class="primary" onclick="shuffleWeek()"><i class="ti ti-refresh"></i> Randomize 3 dinners</button>
      <button class="secondary" onclick="clearWeek()" id="clear-week-btn" style="display:none"><i class="ti ti-x"></i> Clear</button>
    </div>
    <div id="week-grid" class="week-grid"></div>
    <div id="week-notice" style="display:none"></div>
  </div>
</main>

<script>
const DAYS = ['Monday','Wednesday','Friday'];
const TAG_COLORS = [
  ['#EEEDFE','#3C3489'],['#E1F5EE','#085041'],['#FAECE7','#712B13'],
  ['#E6F1FB','#0C447C'],['#EAF3DE','#27500A'],['#FAEEDA','#633806'],
  ['#FBEAF0','#72243E'],['#F1EFE8','#444441']
];
function tagColors(tag){const i=(tag||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0)%TAG_COLORS.length;return TAG_COLORS[i];}
function tagStyle(tag){const[bg,col]=tagColors(tag);return `background:${bg};color:${col}`;}
function load(){try{return JSON.parse(localStorage.getItem('recipebook_recipes')||'[]');}catch{return[];}}
function save(r){localStorage.setItem('recipebook_recipes',JSON.stringify(r));}
function loadWeek(){try{return JSON.parse(localStorage.getItem('recipebook_week')||'[]');}catch{return[];}}
function saveWeek(p){localStorage.setItem('recipebook_week',JSON.stringify(p));}

let recipes=load(), weekPicks=loadWeek(), currentDetailId=null;

if(recipes.length===0){
  recipes=[
    {id:'s1',name:'Spaghetti Carbonara',tag:'Italian',body:'Ingredients:\n- 200g spaghetti\n- 100g pancetta\n- 2 eggs\n- 50g Pecorino Romano\n- Black pepper\n\nMethod:\n1. Cook pasta in salted water.\n2. Fry pancetta until crispy.\n3. Whisk eggs + cheese + pepper.\n4. Toss pasta off heat with pancetta, then egg mix.\n5. Add pasta water to loosen. Serve immediately.'},
    {id:'s2',name:'Chicken Stir-Fry',tag:'Asian',body:'Ingredients:\n- 2 chicken breasts, sliced\n- Mixed veg (bell pepper, broccoli, snap peas)\n- 3 tbsp soy sauce\n- 1 tbsp sesame oil\n- Garlic, ginger\n\nMethod:\n1. Stir-fry chicken in hot oil 4-5 min.\n2. Add garlic and ginger, 30 sec.\n3. Add veg, stir-fry 3 min.\n4. Add soy sauce + sesame oil.\n5. Serve over rice.'},
    {id:'s3',name:'Black Bean Tacos',tag:'Vegetarian',body:'Ingredients:\n- 1 can black beans\n- Corn tortillas\n- Avocado, lime, cilantro\n- Pickled jalapeños, sour cream\n- Cumin, smoked paprika\n\nMethod:\n1. Warm beans with cumin + paprika. Mash lightly.\n2. Warm tortillas.\n3. Fill with beans and toppings.'},
  ];
  save(recipes);
}

function nextId(){return 'r'+Date.now()+Math.floor(Math.random()*1000);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function updateCount(){document.getElementById('recipe-count').textContent=`(${recipes.length})`;}

function renderGrid(){
  const grid=document.getElementById('recipe-grid');
  const empty=document.getElementById('empty-recipes');
  updateCount();
  if(recipes.length===0){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML=recipes.map(r=>`<div class="recipe-card" onclick="openDetail('${r.id}')"><span class="tag-pill" style="${tagStyle(r.tag)}">${esc(r.tag||'Uncategorized')}</span><h3>${esc(r.name)}</h3><p>${esc(r.body)}</p></div>`).join('');
}

function openDetail(id){
  currentDetailId=id;
  const r=recipes.find(x=>x.id===id);if(!r)return;
  document.getElementById('detail-title').textContent=r.name;
  const tag=document.getElementById('detail-tag');
  tag.textContent=r.tag||'Uncategorized';tag.style.cssText=tagStyle(r.tag);
  document.getElementById('detail-body').textContent=r.body;
  document.getElementById('recipe-list-wrap').style.display='none';
  document.getElementById('recipe-detail').style.display='block';
}

function closeDetail(){
  document.getElementById('recipe-detail').style.display='none';
  document.getElementById('recipe-list-wrap').style.display='block';
  currentDetailId=null;
}

function deleteRecipe(){
  if(!confirm('Delete this recipe? This cannot be undone.'))return;
  recipes=recipes.filter(r=>r.id!==currentDetailId);
  weekPicks=weekPicks.filter(p=>p&&p.id!==currentDetailId);
  save(recipes);saveWeek(weekPicks);
  closeDetail();renderGrid();renderWeek();
}

function saveRecipe(){
  const name=document.getElementById('recipe-name').value.trim();
  const tag=document.getElementById('recipe-tag').value.trim();
  const body=document.getElementById('recipe-body').value.trim();
  const notice=document.getElementById('save-notice');
  if(!name){document.getElementById('recipe-name').focus();return;}
  if(!body){document.getElementById('recipe-body').focus();return;}
  recipes.push({id:nextId(),name,tag,body});save(recipes);
  document.getElementById('recipe-name').value='';
  document.getElementById('recipe-tag').value='';
  document.getElementById('recipe-body').value='';
  notice.className='notice success';
  notice.textContent=`"${name}" saved to your recipe book!`;
  notice.style.display='block';
  setTimeout(()=>{notice.style.display='none';},3000);
  updateCount();
}

function shuffleWeek(){
  const notice=document.getElementById('week-notice');
  if(recipes.length<3){
    notice.className='notice error';
    notice.textContent=`You need at least 3 recipes. You have ${recipes.length}.`;
    notice.style.display='block';return;
  }
  notice.style.display='none';
  const pool=[...recipes].sort(()=>Math.random()-.5);
  weekPicks=pool.slice(0,3);saveWeek(weekPicks);renderWeek();
}

function clearWeek(){weekPicks=[];saveWeek(weekPicks);renderWeek();}

function renderWeek(){
  const grid=document.getElementById('week-grid');
  document.getElementById('clear-week-btn').style.display=weekPicks.length?'flex':'none';
  grid.innerHTML=DAYS.map((d,i)=>{
    const r=weekPicks[i];
    if(!r)return `<div class="week-card empty"><div class="day-label">${d}</div><h3>Not picked yet</h3></div>`;
    return `<div class="week-card"><div class="day-label">${d}</div><h3>${esc(r.name)}</h3><span class="tag-pill" style="${tagStyle(r.tag)};font-size:11px">${esc(r.tag||'Uncategorized')}</span></div>`;
  }).join('');
}

function showTab(name){
  ['recipes','add','week'].forEach(n=>{
    document.getElementById('tab-'+n).classList.toggle('active',n===name);
    document.getElementById('view-'+n).classList.toggle('active',n===name);
  });
  if(name==='recipes'){closeDetail();renderGrid();}
  if(name==='week')renderWeek();
}

renderGrid();renderWeek();
</script>
</body>
</html>
